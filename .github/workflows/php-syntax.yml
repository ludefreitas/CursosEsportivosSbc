name: Validação PHP

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  php-syntax:
    name: Sintaxe PHP 8.1
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Validar arquivos PHP
        shell: bash
        run: |
          set -euo pipefail
          find app config public -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l index.php
          php -l router.php
          php -l teste-erros.php

      - name: Verificar codificação corrompida
        shell: bash
        run: |
          if grep -RInE 'Ã|Â|â€|ðŸ' app config database public --include='*.php' --include='*.js' --include='*.sql' --include='*.md'; then
            echo 'Foram encontrados possíveis textos com codificação corrompida.'
            exit 1
          fi

      - name: Confirmar UTF-8 no HTML
        shell: bash
        run: grep -Fq '<meta charset="utf-8">' app/Views/partials/header.php

