name: Validação PHP

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  php-syntax:
    name: Sintaxe PHP 8.1
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Validar arquivos PHP
        shell: bash
        run: |
          set -euo pipefail
          find app config public -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l index.php
          php -l router.php
          php -l teste-erros.php

      - name: Verificar codificação corrompida
        shell: bash
        run: |
          set -euo pipefail
          find app config database public -type f \( -name '*.php' -o -name '*.js' -o -name '*.sql' -o -name '*.md' \) -print0 |
            while IFS= read -r -d '' arquivo; do
              iconv -f UTF-8 -t UTF-8 "$arquivo" >/dev/null
            done

          # Procura sequências típicas de UTF-8 interpretado como Windows-1252,
          # sem rejeitar letras portuguesas legítimas, como Ã em INSCRIÇÃO.
          if grep -RInE 'Ã¡|Ã |Ã¢|Ã£|Ã¤|Ã§|Ã©|Ãª|Ã­|Ã³|Ã´|Ãµ|Ã¶|Ãº|Ã¼|Âº|Âª|Â |â€|ðŸ|�' app config database public --include='*.php' --include='*.js' --include='*.sql' --include='*.md'; then
            echo 'Foram encontrados possíveis textos com codificação corrompida.'
            exit 1
          fi

      - name: Confirmar UTF-8 no HTML
        shell: bash
        run: grep -Fq '<meta charset="utf-8">' app/Views/partials/header.php
